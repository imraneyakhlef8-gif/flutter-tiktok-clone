name: flutter_tiktok_clone
description: A short drama app MVP with dark theme, built with Flutter and Firebase.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_storage: ^11.5.0
  cloud_firestore: ^4.13.0
  firebase_auth: ^4.15.0

  # Video playback
  video_player: ^2.8.1
  chewie: ^1.7.4

  # UI & State Management
  provider: ^6.1.0
  cupertino_icons: ^1.0.2
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  image_picker: ^1.0.5
  permission_handler: ^11.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
